  const DAYS = [["0", "Any time"], ["1", "Today"], ["7", "Last 7 days"], ["30", "Last 30 days"], ["365", "Last year"]];
  const SOURCES = { region: "Area", window: "Window", screen: "Full screen", record: "Screen recording", web: "Web page", style: "Style editor", import: "Import", paste: "Clipboard" };
  const ACTION_LABELS = { region: "Capture an area", window: "Capture the front window", screen: "Capture the full screen", record: "Record an area", open: "Open Hagaki" };

  const state = {
    preview: false,
    list: null, listKey: "", limit: 120,
    settings: null,
    daemon: { running: false, autostart: false },
    dstat: null,
    item: null, itemData: null,
    stampMtime: null, stamp: null,
    busy: {},
    logs: null,
  };

  function isPreview() {
    if (new URLSearchParams(location.search).get("_preview") === "1") return true;
    try {
      let w = window;
      while (w.parent && w.parent !== w) {
        w = w.parent;
        if (new URLSearchParams(w.location.search).get("_preview") === "1") return true;
      }
    } catch (e) { }
    return false;
  }

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const P = {
    get: (k, d) => { const v = fused.params.get(k); return v == null || v === "" ? d : v; },
    set: (k, v) => fused.params.set(k, v == null ? "" : String(v)),
  };

  function api(op, params, opts) {
    const p = Object.assign({ op }, params || {});
    for (const k of Object.keys(p)) p[k] = p[k] == null ? "" : (typeof p[k] === "object" ? JSON.stringify(p[k]) : String(p[k]));
    return fused.runPython("api.py", p, Object.assign({ key: null }, opts || {}));
  }

  function errText(e) {
    if (!e) return "Unknown error";
    const m = e.message || String(e);
    const lines = m.split("\n").filter(Boolean);
    return lines[lines.length - 1].replace(/^\w+Error: /, "");
  }

  let snackTimer = null;
  function snack(msg, isErr, done) {
    const root = $("#snackRoot");
    root.innerHTML = `<div class="snack${isErr ? " err" : ""}" role="status">${done ? ICONS.check : ""}${esc(msg)}</div>`;
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => { root.innerHTML = ""; }, isErr ? 6000 : 2600);
  }

  function fmtBytes(n) {
    if (!n && n !== 0) return "";
    const u = ["B", "KB", "MB", "GB"]; let i = 0; let v = n;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i ? v.toFixed(v < 10 ? 1 : 0) : v) + " " + u[i];
  }
  function fmtDur(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit" });
  const dateFmt = new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const fullFmt = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "medium" });
  function dayLabel(ts) {
    const d = new Date(ts * 1000); const now = new Date();
    const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((start(now) - start(d)) / 86400000);
    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";
    return dateFmt.format(d);
  }
  function ago(ts) {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return "now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return Math.floor(s / 86400) + " d ago";
  }
  function keyLabel(action) {
    const d = state.dstat && state.dstat.bound && state.dstat.bound[action];
    if (d && d.length) return d[d.length - 1];
    return (state.settings && state.settings.hotkey_labels && state.settings.hotkey_labels[action]) || "";
  }
  function thumbUrl(it) { return it.thumb ? fused.rawUrl(it.thumb) : (it.kind !== "video" ? fused.rawUrl(it.path) : ""); }

  function renderPreviewPlaceholder() {
    $("#statusText").textContent = "Preview";
    $("#snav").innerHTML = navHtml(null);
    $("#tab-gallery").innerHTML = `<div class="placeholder">Hagaki saves each screenshot, copies it to the clipboard and adds it to this gallery.</div>`;
  }

  function storedPref(k, d) { try { return localStorage.getItem("hagaki." + k) || d; } catch (e) { return d; } }
  function setPref(k, v) { try { localStorage.setItem("hagaki." + k, v); } catch (e) { } P.set(k, v); }
  function curNav() { return P.get("nav", storedPref("nav", "on")) === "off" ? "off" : "on"; }
  function curView() { const v = P.get("view", storedPref("view", "gallery")); return VIEWS.some((x) => x[0] === v) ? v : "gallery"; }
  function curGroup() { const g = P.get("group", storedPref("group", "app")); return GROUPS.some((x) => x[0] === g) ? g : "app"; }
  function curSort() {
    const [col, dir] = P.get("sort", storedPref("sort", "created:desc")).split(":");
    return { col: COLUMNS.some((c) => c[0] === col) ? col : "created", dir: dir === "asc" ? "asc" : "desc" };
  }

  async function refreshDaemon() {
    try { state.daemon = await fused.daemon.status(); } catch (e) { state.daemon = { running: false, autostart: false }; }
    renderStatus();
    if (state.daemon.autostart && !state.daemon.running && !state.healed) {
      state.healed = true;
      try { await fused.daemon.start(); } catch (e) { snack("Hagaki did not start: " + errText(e), true); }
      setTimeout(refreshDaemon, 600);
    }
  }

  function renderStatus() {
    const chip = $("#statusChip");
    const d = state.daemon || {};
    const rec = state.dstat && state.dstat.recording;
    chip.classList.toggle("on", !!d.running && !rec);
    chip.classList.toggle("rec", !!rec);
    let text = d.running ? "On" : d.autostart ? "Starting…" : "Off";
    if (d.running && state.dstat && state.dstat.paused) text = "Paused";
    if (rec) text = "Recording · click to stop";
    else if (d.running && keyLabel("region")) text += " · " + keyLabel("region");
    $("#statusText").textContent = text;
    chip.title = rec ? "Click to stop the recording." : d.running ? "Hagaki is on" + (d.autostart ? " and starts with Fused Render" : "") + ". Click to turn it off." : "Hagaki is off. Click to turn it on.";
  }

  async function turnOn() {
    try {
      await fused.daemon.start();
      await fused.daemon.setAutostart(true);
      if (state.settings && !state.settings.settings.onboarded) await api("save_settings", { patch: { onboarded: true } });
      snack("Hagaki is on. It starts with Fused Render.");
    } catch (e) {
      snack("Hagaki did not start: " + errText(e), true);
    }
    setTimeout(() => { refreshDaemon(); loadSettings(); }, 600);
  }

  async function turnOff() {
    try {
      await fused.daemon.setAutostart(false);
      await fused.daemon.stop();
      snack("Hagaki is off. It stays off until you turn it on.");
    } catch (e) {
      snack(errText(e), true);
    }
    setTimeout(() => { refreshDaemon().then(loadSettings); }, 500);
  }

  async function daemonCall(path, body) {
    return fused.daemon.call(path, body || {});
  }

  async function capture(mode) {
    if (!state.daemon.running && state.daemon.autostart) await turnOn();
    else if (!state.daemon.running) {
      const ok = await confirmModal("Turn on Hagaki?", "Hagaki must run in the background to capture. It also starts with Fused Render. You can change this in Settings.", "Turn on");
      if (!ok) return;
      await turnOn();
    }
    try {
      await daemonCall("/capture", { mode });
    } catch (e) { snack("Capture did not start: " + errText(e), true); }
  }

  function galleryKey() {
    return [P.get("q", ""), P.get("kind", "all"), P.get("app", ""), P.get("days", "0"), state.limit].join("|");
  }

  async function loadList(force) {
    const key = galleryKey();
    if (!force && key === state.listKey && state.list) { renderGallery(); return; }
    if (!state.list) renderGallery();
    try {
      const res = await api("list", { q: P.get("q", ""), kind: P.get("kind", "all"), app: P.get("app", ""), days: P.get("days", "0"), limit: state.limit }, { key: "list" });
      state.list = res; state.listKey = key;
      if (res.stamp) state.stamp = res.stamp;
      if (res.daemon !== undefined) state.dstat = res.daemon;
      renderGallery(); renderStatus(); renderDrawerHead();
    } catch (e) {
      $("#tab-gallery").innerHTML = `<div class="placeholder">The gallery did not load: ${esc(errText(e))}</div>`;
    }
  }

  function offHtml() {
    return state.daemon.running || state.daemon.autostart ? "" : `<div class="off-banner"><p><b>Hagaki is off.</b> Turn it on to use the shortcuts. It then starts each time Fused Render starts.</p><button class="btn primary small" data-act="turn-on" type="button">Turn on</button></div>`;
  }

  function navHtml(L) {
    const sec = (title, rows) => `<div class="nsec"><h4>${title}</h4>${rows}</div>`;
    const row = (attr, val, on, lead, label, n) => `<button class="nrow" ${attr}="${esc(val)}" type="button" aria-pressed="${on}">${lead}<span class="lb">${esc(label)}</span>${n == null ? "" : `<span class="n">${n}</span>`}</button>`;
    let html = sec("Capture", CAPTURES.map(([m, t, ic]) => {
      const k = keyLabel(m);
      return `<button class="nrow" data-capture="${m}" type="button" title="${ACTION_LABELS[m]}${k ? ` (${esc(k)})` : ""}">${ICONS[ic]}<span class="lb">${t}</span>${k ? `<kbd>${esc(k)}</kbd>` : ""}</button>`;
    }).join(""));
    if (!L) return html;
    const kind = P.get("kind", "all"); const app = P.get("app", ""); const days = P.get("days", "0");
    const counts = (L.facets && L.facets.kinds) || {};
    const total = (L.facets && L.facets.all) || 0;
    const apps = ((L.facets && L.facets.apps) || []).map((a) => [a.app, a.n]);
    if (app && !apps.some((a) => a[0] === app)) apps.push([app, 0]);
    const pip = `<span class="pip"></span>`;
    html += sec("Type", KINDS.map(([k, t]) => row("data-kind", k, kind === k, ICONS[KIND_ICONS[k]], t, k === "all" ? total : (counts[k] || 0))).join(""));
    html += sec("Apps", [["", total, "All apps"], ...apps].map(([v, n, t]) => row("data-app", v, app === v, pip, t || v, n)).join(""));
    html += sec("Date", DAYS.map(([v, t]) => row("data-days", v, days === v, pip, t, null)).join(""));
    return html;
  }

  const shortFmt = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });
  function itemSrc(it) { return it.app || SOURCES[it.source] || ""; }
  function dimsText(it) { return it.width ? `${it.width}×${it.height}` : ""; }
  function selCls(it) { return state.item === it.id ? " sel" : ""; }
  function sharedHtml(it) { return it.share_url ? '<span class="shared-dot" title="Online"></span>' : ""; }
  function markHtml(it) {
    if (it.verify === "ok") return `<span class="mark" title="File checked: SHA-256 matches">${ICONS.check}</span>`;
    if (it.verify) return `<span class="mark warn" title="${it.verify === "missing" ? "File is missing" : "File changed after capture"}">!</span>`;
    return "";
  }
  function mediaHtml(it) {
    const src = thumbUrl(it);
    return (src ? `<img loading="lazy" decoding="async" alt="" src="${esc(src)}">` : `<div class="ph">No preview</div>`)
      + (it.kind === "video" ? `<span class="play">${ICONS.play}${it.duration ? fmtDur(it.duration) : "Video"}</span>` : "");
  }

  function cardHtml(it) {
    const dims = dimsText(it);
    return `<button class="card it${selCls(it)}" data-id="${esc(it.id)}" type="button" title="${esc(it.name)}">
      <div class="media">${mediaHtml(it)}${it.source === "style" ? `<span class="tag-styled">Styled</span>` : ""}</div>
      <div class="cbody">
        <div class="cname">${esc(it.name)}</div>
        <div class="cmeta">${sharedHtml(it)}<span class="app">${esc(itemSrc(it))}</span>${dims ? `<span>·</span><span>${dims}</span>` : ""}<span class="when">${timeFmt.format(new Date(it.created * 1000))}</span>${markHtml(it)}</div>
        ${it.snippet ? `<div class="snip">${esc(it.snippet)}</div>` : ""}
      </div>
    </button>`;
  }

  function rowHtml(it) {
    const sub = it.snippet || [KIND_LABELS[it.kind] || it.kind, itemSrc(it), dimsText(it), fmtBytes(it.bytes)].filter(Boolean).join(" · ");
    return `<button class="lrow it${selCls(it)}" data-id="${esc(it.id)}" type="button" title="${esc(it.name)}">
      <span class="lthumb">${mediaHtml(it)}</span>
      <span class="lmain"><span class="lname">${esc(it.name)}</span><span class="lsub">${esc(sub)}</span></span>
      <span class="lside">${sharedHtml(it)}${markHtml(it)}<span>${timeFmt.format(new Date(it.created * 1000))}</span></span>
    </button>`;
  }

  function sortVal(it, col) {
    if (col === "dims") return (it.width || 0) * (it.height || 0);
    if (col === "bytes" || col === "created") return it[col] || 0;
    if (col === "kind") return KIND_LABELS[it.kind] || it.kind || "";
    if (col === "app") return itemSrc(it).toLowerCase();
    return String(it[col] || "").toLowerCase();
  }

  function sortedItems(items) {
    const s = curSort(); const k = s.dir === "asc" ? 1 : -1;
    return items.slice().sort((a, b) => {
      const x = sortVal(a, s.col), y = sortVal(b, s.col);
      return (x < y ? -1 : x > y ? 1 : 0) * k || (b.created - a.created);
    });
  }

  function tableHtml(items) {
    const s = curSort();
    const head = COLUMNS.map(([c, t]) => `<th${s.col === c ? ` aria-sort="${s.dir === "asc" ? "ascending" : "descending"}"` : ""}><button type="button" data-sort="${c}">${t}${s.col === c ? (s.dir === "asc" ? " ↑" : " ↓") : ""}</button></th>`).join("");
    const rows = items.map((it) => {
      const src = thumbUrl(it);
      return `<tr class="it${selCls(it)}" data-id="${esc(it.id)}" tabindex="0">
        <td><div class="tthumb">${src ? `<img loading="lazy" decoding="async" alt="" src="${esc(src)}">` : ""}</div></td>
        <td class="nm" title="${esc(it.name)}">${esc(it.name)}</td>
        <td>${esc(KIND_LABELS[it.kind] || it.kind)}${it.duration ? " · " + fmtDur(it.duration) : ""}</td>
        <td>${esc(itemSrc(it))}</td>
        <td title="${esc(it.title || "")}">${esc(it.title || "")}</td>
        <td class="num">${dimsText(it)}</td>
        <td class="num">${fmtBytes(it.bytes)}</td>
        <td class="num">${shortFmt.format(new Date(it.created * 1000))}</td>
      </tr>`;
    }).join("");
    return `<div class="tablewrap scroll"><table class="dt"><thead><tr><th aria-label="Preview"></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function boardGroups(items) {
    const g = curGroup(); const m = new Map();
    for (const it of items) {
      const k = g === "kind" ? (KIND_LABELS[it.kind] || it.kind) : g === "day" ? dayLabel(it.created) : (itemSrc(it) || "Other");
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(it);
    }
    return Array.from(m);
  }

  function boardHtml(items) {
    return `<div class="board scroll">${boardGroups(items).map(([k, arr]) => `<section class="bcol"><h3>${esc(k)}<span class="n">${arr.length}</span></h3><div class="bcards">${arr.map((it) => `<button class="bcard it${selCls(it)}" data-id="${esc(it.id)}" type="button" title="${esc(it.name)}">
        <div class="media">${mediaHtml(it)}</div>
        <span class="lname">${esc(it.name)}</span>
        <span class="lsub">${esc([shortFmt.format(new Date(it.created * 1000)), dimsText(it)].filter(Boolean).join(" · "))}</span>
      </button>`).join("")}</div></section>`).join("")}</div>`;
  }

  function byDayHtml(items, wrapCls, one) {
    let html = ""; let cur = null;
    for (const it of items) {
      const lab = dayLabel(it.created);
      if (lab !== cur) {
        if (cur !== null) html += `</div>`;
        html += `<div class="day"><h3>${esc(lab)}</h3><span class="rule"></span></div><div class="${wrapCls}">`;
        cur = lab;
      }
      html += one(it);
    }
    return html + (cur !== null ? `</div>` : "");
  }

  function emptyHtml(filtered) {
    const art = `<svg viewBox="0 0 220 140" fill="none"><rect x="14" y="10" width="192" height="120" rx="8" fill="var(--paper)" stroke="var(--line-2)"/><rect x="34" y="30" width="152" height="80" rx="4" stroke="var(--ink-3)" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M46 98l30-30 20 20 16-14 30 24z" fill="var(--ai)" opacity=".3"/><circle cx="160" cy="50" r="9" fill="var(--shu)" opacity=".8"/></svg>`;
    if (filtered) return `<div class="empty">${art}<h2>Nothing matches</h2><p>Change the search text or the filters.</p></div>`;
    const k = keyLabel("region");
    return `<div class="empty">${art}<h2>No captures yet</h2><p>${k ? `Press <kbd>${esc(k)}</kbd> and drag an area. ` : ""}The screenshot goes to the clipboard and to this gallery.</p></div>`;
  }

  function renderGallery() {
    const root = $("#tab-gallery");
    const L = state.list;
    $("#snav").innerHTML = navHtml(L);
    if (!L) { root.innerHTML = offHtml() + `<div class="placeholder">Loading…</div>`; return; }
    const kind = P.get("kind", "all"); const app = P.get("app", ""); const days = P.get("days", "0"); const q = P.get("q", "");
    const view = curView(); const group = curGroup();
    const filtered = !!(q || kind !== "all" || app || days !== "0");
    const navOn = curNav() === "on";
    let html = offHtml();
    html += `<div class="vbar">
      <button class="icon-btn" data-act="toggle-nav" type="button" title="${navOn ? "Hide" : "Show"} the sidebar" aria-label="${navOn ? "Hide" : "Show"} the sidebar">${ICONS.nav}</button>
      ${VIEWS.map(([v, t, ic]) => `<button class="vtab" type="button" data-view="${v}" aria-pressed="${view === v}" title="${t}">${ICONS[ic]}<span>${t}</span></button>`).join("")}
      <div class="vright">
        ${view === "board" ? `<select class="select" id="fGroup" aria-label="Group by">${GROUPS.map(([v, t]) => `<option value="${v}"${v === group ? " selected" : ""}>Group by ${t.toLowerCase()}</option>`).join("")}</select>` : ""}
        ${filtered ? `<button class="btn ghost small" data-act="clear-filters" type="button">Clear filters</button>` : ""}
        <span class="count">${L.total} ${L.total === 1 ? "item" : "items"}${q ? ` for “${esc(q)}”` : ""}</span>
      </div>
    </div>`;
    if (!L.items.length) {
      html += emptyHtml(filtered);
    } else {
      if (view === "list") html += byDayHtml(L.items, "rows", rowHtml);
      else if (view === "table") html += tableHtml(sortedItems(L.items));
      else if (view === "board") html += boardHtml(L.items);
      else html += byDayHtml(L.items, "grid", cardHtml);
      if (L.total > L.items.length) html += `<div class="more"><button class="btn" data-act="more" type="button">Show more (${L.total - L.items.length})</button></div>`;
    }
    root.innerHTML = html;
  }

  function currentItems() {
    const items = (state.list && state.list.items) || [];
    const v = curView();
    if (v === "table") return sortedItems(items);
    if (v === "board") return boardGroups(items).flatMap((g) => g[1]);
    return items;
  }

  async function openItem(id) {
    P.set("item", id);
  }

  async function loadItem(id, quiet) {
    if (!id) { state.itemData = null; renderDrawer(); return; }
    if (!quiet) { state.itemData = { loading: true, id }; renderDrawer(); }
    try {
      const res = await api("item", { id }, { key: "item" });
      if (res.error) { state.itemData = { error: res.error, id }; }
      else state.itemData = res;
    } catch (e) { state.itemData = { error: errText(e), id }; }
    renderDrawer();
  }

  function closeDrawer() { P.set("item", ""); P.set("studio", ""); }

  function stepItem(dir) {
    const items = currentItems();
    const i = items.findIndex((x) => x.id === state.item);
    if (i < 0) return;
    const n = items[i + dir];
    if (n) openItem(n.id);
  }

  function renderDrawer() {
    const root = $("#drawerRoot");
    const id = state.item;
    if (!id) { root.innerHTML = ""; state.focusedItem = null; return; }
    const D = state.itemData;
    let body = "";
    if (!D || D.loading) body = `<div class="placeholder">Loading…</div>`;
    else if (D.error) body = `<div class="placeholder">${esc(D.error)}</div>`;
    else body = drawerBody(D);
    root.innerHTML = `<div class="drawer-scrim" data-act="close-drawer"></div>
      <aside class="drawer" role="dialog" aria-label="Capture details" tabindex="-1">
        <div class="dhead"></div>
        <div class="dbody scroll">${body}</div>
      </aside>`;
    renderDrawerHead();
    if (state.focusedItem !== id && !Studio.open) {
      state.focusedItem = id;
      window.focus();
      $("#drawerRoot .drawer").focus({ preventScroll: true });
    }
  }

  function renderDrawerHead() {
    const head = $("#drawerRoot .dhead");
    if (!head || !state.item) return;
    const items = currentItems(); const idx = items.findIndex((x) => x.id === state.item);
    head.innerHTML = `
      <button class="icon-btn" data-act="prev" title="Previous (←)" type="button"${idx <= 0 ? " disabled" : ""}>${ICONS.left}</button>
      <button class="icon-btn" data-act="next" title="Next (→)" type="button"${idx < 0 || idx >= items.length - 1 ? " disabled" : ""}>${ICONS.right}</button>
      <div class="grow">${idx >= 0 ? `${idx + 1} of ${state.list.total}` : ""}</div>
      <button class="icon-btn" data-act="close-drawer" title="Close (Esc)" type="button">${ICONS.close}</button>`;
  }

  function editingIn(sel) {
    const a = document.activeElement;
    return !!(a && a.closest && a.closest(sel) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }

  function drawerEditing() {
    const v = $("#drawerRoot video");
    return editingIn("#drawerRoot") || !!(v && !v.paused && !v.ended);
  }

  function drawerBody(D) {
    const it = D.item;
    const isVid = it.kind === "video";
    const src = fused.rawUrl(it.path);
    const verifyCls = it.verify === "ok" ? "ok" : "bad";
    const verifyTxt = it.verify === "ok" ? "Correct — SHA-256 matches" : it.verify === "missing" ? "File is missing" : it.verify === "changed" ? "File changed after capture" : "Not checked";
    const busy = state.busy;
    const media = !it.exists ? `<div class="placeholder">The file is missing.<br><span class="mono">${esc(it.path)}</span></div>`
      : isVid ? `<video controls preload="metadata" src="${esc(src)}"></video>` : `<img alt="" src="${esc(src)}">`;
    const share = it.share_state === "uploading" ? `<div class="sharebox">${ICONS.share}<span>Uploading to Fused…</span></div>`
      : it.share_url ? `<div class="sharebox">${ICONS.link}<a href="${esc(it.share_url)}" target="_blank" rel="noopener">${esc(it.share_url)}</a><button class="btn small" data-act="copy-link" type="button">Copy link</button></div>`
      : it.share_state === "error" ? `<div class="sharebox"><span>The upload failed. See Logs.</span></div>` : "";
    const ocr = isVid ? "" : `<div class="sec"><h4>Text in the image <span class="rule"></span>
        ${it.ocr ? `<button class="btn small ghost" data-act="copy-ocr" type="button">Copy text</button>` : ""}
        <button class="btn small ghost" data-act="ocr" type="button"${busy.ocr ? " disabled" : ""}>${busy.ocr ? "Reading…" : it.ocr_state === "done" ? "Read again" : "Read text"}</button></h4>
        ${it.ocr ? `<div class="ocr scroll">${esc(it.ocr)}</div>` : `<div class="muted">${it.ocr_state === "pending" ? "Hagaki reads the text soon." : it.ocr_state === "error" ? "Text reading failed." : "No text found."}</div>`}</div>`;
    const children = D.children && D.children.length ? `<div class="sec"><h4>Styled versions <span class="rule"></span></h4><div class="children">${D.children.map((c) => `<button type="button" data-open="${esc(c.id)}" title="${esc(c.name)}"><img alt="" src="${esc(thumbUrl(c))}"></button>`).join("")}</div></div>` : "";
    const parent = it.parent ? `<dt>Made from</dt><dd><button class="link" data-open="${esc(it.parent)}" type="button">Original capture</button></dd>` : "";
    return `
      <div class="preview">${media}</div>
      <div class="namebox">
        <input id="nameInput" value="${esc(it.name)}" aria-label="Name" spellcheck="false" />
        <button class="magic${busy.magic ? " busy" : ""}" data-act="magic" title="Magic rename: read the image and give it a name" type="button"${busy.magic ? " disabled" : ""}>${ICONS.magic}</button>
      </div>
      <div class="drow">
        <button class="btn" data-act="copy" title="Copy to the clipboard (C)" type="button"${it.exists ? "" : " disabled"}>${ICONS.copy}Copy</button>
        ${isStyledVideo(it) ? "" : `<button class="btn" data-act="style" type="button"${it.exists ? "" : " disabled"} title="${isVid ? "Add a background, a frame and zoom on clicks" : "Add a background and a frame"}">${ICONS.style}Style</button>`}
        <button class="btn" data-act="share" type="button"${it.exists && it.share_state !== "uploading" ? "" : " disabled"}>${ICONS.share}${it.share_url ? "Update online copy" : "Put online"}</button>
        <button class="btn ghost" data-act="open-file" title="Open in Fused Render in a new tab" type="button"${it.exists ? "" : " disabled"}>${ICONS.reveal}</button>
        <button class="btn ghost" data-act="reveal" title="Show in Finder" type="button">${ICONS.folder}</button>
        <button class="btn ghost" data-act="trash" title="Move to the Trash" type="button">${ICONS.trash}</button>
      </div>
      ${share}
      <div class="sec"><h4>Details <span class="rule"></span></h4>
        <dl class="kv">
          <dt>Captured</dt><dd>${esc(fullFmt.format(new Date(it.created * 1000)))} <span class="muted">· ${ago(it.created)}</span></dd>
          <dt>Type</dt><dd>${esc(SOURCES[it.source] || it.source)}${it.kind === "styled" ? " · styled" : ""}</dd>
          ${it.app ? `<dt>App</dt><dd>${esc(it.app)}</dd>` : ""}
          ${it.title ? `<dt>Window</dt><dd>${esc(it.title)}</dd>` : ""}
          <dt>Size</dt><dd>${it.width ? `${it.width} × ${it.height} px · ` : ""}${fmtBytes(it.bytes)}${it.duration ? " · " + fmtDur(it.duration) : ""}</dd>
          <dt>Name from</dt><dd>${esc({ pattern: "Name pattern", manual: "You", ai: "Magic rename" }[it.name_source] || it.name_source || "")}</dd>
          <dt>Clipboard</dt><dd>${it.clipboard ? "Copied after capture" : "Not copied"}</dd>
          ${parent}
          <dt>File</dt><dd class="mono" style="font-size:12px">${esc(it.path)}</dd>
          <dt>Check</dt><dd><span class="verify ${verifyCls}">${it.verify === "ok" ? ICONS.check.replace("<svg", '<svg width="14" height="14"') : ""}${verifyTxt}</span>
            <button class="btn small ghost" data-act="verify" type="button">Check again</button><br>
            <span class="mono muted" style="font-size:11px">SHA-256 ${esc((it.sha256 || "").slice(0, 16))}… · ${it.verified ? esc(fullFmt.format(new Date(it.verified * 1000))) : ""}</span></dd>
        </dl>
      </div>
      <div class="sec"><h4>Tags and note <span class="rule"></span></h4>
        <input class="field" id="tagsInput" placeholder="Tags, with commas between them" value="${esc(it.tags || "")}" />
        <textarea class="field" id="noteInput" placeholder="Note" style="margin-top:8px">${esc(it.note || "")}</textarea>
      </div>
      ${ocr}
      ${children}
      <div class="sec"><h4>History <span class="rule"></span></h4>
        <ul class="hist">${(D.events || []).map((e) => `<li><time>${esc(timeFmt.format(new Date(e.ts * 1000)))}</time><span><span class="lvl ${esc(e.level)}">${esc(e.level)}</span> ${esc(e.message)}</span></li>`).join("") || `<li><span class="muted">No events.</span></li>`}</ul>
      </div>`;
  }

  async function pasteClipboard() {
    try {
      const r = await api("paste");
      const n = r.items.length;
      snack(n === 1 ? "Added from the clipboard." : `Added ${n} files from the clipboard.`);
      await loadList(true);
      if (r.items[0]) openItem(r.items[0].id);
    } catch (e) { snack(errText(e), true); }
  }

  function flashDone(act, label) {
    const b = $(`#drawerRoot [data-act="${act}"]`);
    if (!b || b.classList.contains("done")) return;
    const before = b.innerHTML;
    b.classList.add("done");
    b.innerHTML = ICONS.check + esc(label);
    setTimeout(() => { b.classList.remove("done"); b.innerHTML = before; }, 1600);
  }

  function viewerUrl(path) {
    return location.origin + "/explorer/view/" + path.replace(/^\//, "").split("/").map(encodeURIComponent).join("/");
  }

  async function fusedSignedIn() {
    const status = async () => (await fetch("/api/canvases/status")).json();
    let st;
    try { st = await status(); } catch (e) { return true; }
    if (st.logged_in) return true;
    if (fused.device && fused.device !== "desktop") { snack("Sign in to Fused on the computer first.", true); return false; }
    const ok = await confirmModal("Sign in to Fused first", "Hagaki puts captures online with your Fused account. Sign in, then Hagaki continues.", "Sign in");
    if (!ok) return false;
    try {
      const r = await fetch("/api/canvases/login", { method: "POST", headers: { "X-Fused": "1", "Content-Type": "application/json" }, body: "{}" });
      if (!r.ok) throw new Error("HTTP " + r.status);
    } catch (e) { snack("The Fused sign-in did not start: " + errText(e), true); return false; }
    snack("Finish the sign-in in your browser.");
    for (let i = 0; i < 300; i++) {
      await new Promise((r) => setTimeout(r, 2000));
      let s;
      try { s = await status(); } catch (e) { continue; }
      if (s.logged_in && s.creds_stamp !== st.creds_stamp) { snack("Signed in to Fused.", false, true); return true; }
      if (!s.login_in_flight && i > 1) { snack("The Fused sign-in did not finish.", true); return false; }
    }
    return false;
  }

  async function itemAction(act) {
    const D = state.itemData; if (!D || !D.item) return;
    const it = D.item;
    try {
      if (act === "copy") {
        await api("copy", { id: it.id });
        flashDone("copy", "Copied");
        snack(it.kind === "video" ? "Recording copied to the clipboard." : it.kind === "styled" ? "Styled image copied to the clipboard." : "Screenshot copied to the clipboard.", false, true);
      }
      else if (act === "reveal") await api("reveal", { id: it.id });
      else if (act === "open-file") window.open(viewerUrl(it.path), "_blank", "noopener");
      else if (act === "verify") { const r = await api("verify", { id: it.id }); snack(r.item.verify === "ok" ? "The file is correct." : "The file is not the same as at capture.", r.item.verify !== "ok"); await loadItem(it.id, true); }
      else if (act === "copy-ocr") { await api("copy_text", { text: it.ocr }); flashDone("copy-ocr", "Copied"); snack("Text copied to the clipboard.", false, true); }
      else if (act === "copy-link") { await api("copy_text", { text: it.share_url }); flashDone("copy-link", "Copied"); snack("Link copied to the clipboard.", false, true); }
      else if (act === "ocr") {
        state.busy.ocr = true; renderDrawer();
        try { await api("ocr", { id: it.id }); } finally { state.busy.ocr = false; }
        await loadItem(it.id, true);
      }
      else if (act === "magic") {
        state.busy.magic = true; renderDrawer();
        try {
          const r = await api("ai_rename", { id: it.id });
          snack("New name: " + r.item.name);
        } finally { state.busy.magic = false; }
        await loadItem(it.id, true); loadList(true);
      }
      else if (act === "share") {
        if (!(await fusedSignedIn())) return;
        const canvas = ((state.settings && state.settings.settings.share.mode) || "public") === "temporary" ? "hagaki_temporary" : "hagaki_public";
        const ok = await confirmModal(it.share_url ? "Update the online copy?" : "Put this online?",
          `Hagaki uploads the file to your Fused account, adds it to the canvas ${canvas} and makes a link. Anyone with the link can see it.`, it.share_url ? "Update" : "Put online");
        if (!ok) return;
        await api("share", { id: it.id });
        snack("The upload started. The link goes to the clipboard when it is ready.");
        await loadItem(it.id, true);
      }
      else if (act === "trash") {
        const ok = await confirmModal("Move to the Trash?", `“${it.name}” goes to the macOS Trash. You can get it back from there.`, "Move to Trash");
        if (!ok) return;
        const items = currentItems(); const i = items.findIndex((x) => x.id === it.id);
        const next = items[i + 1] || items[i - 1];
        await api("trash", { id: it.id });
        snack("Moved to the Trash.");
        if (next) openItem(next.id); else closeDrawer();
        loadList(true);
      }
      else if (act === "style" && !isStyledVideo(it)) P.set("studio", "1");
    } catch (e) { state.busy = {}; renderDrawer(); snack(errText(e), true); }
  }

  let renaming = false;
  async function saveName() {
    const D = state.itemData; if (!D || !D.item || renaming) return;
    const input = $("#nameInput"); if (!input) return;
    const v = input.value.trim();
    if (!v || v === D.item.name) { input.value = D.item.name; return; }
    renaming = true;
    try {
      const r = await api("rename", { id: D.item.id, name: v });
      D.item = r.item; snack("Renamed.");
      renderDrawer(); loadList(true);
    } catch (e) { snack(errText(e), true); input.value = D.item.name; }
    finally { renaming = false; }
  }

  async function saveMeta() {
    const D = state.itemData; if (!D || !D.item) return;
    const tags = $("#tagsInput"), note = $("#noteInput");
    if (!tags || !note) return;
    if (tags.value === (D.item.tags || "") && note.value === (D.item.note || "")) return;
    try {
      const r = await api("meta", { id: D.item.id, tags: tags.value, note: note.value });
      D.item = r.item;
    } catch (e) { snack(errText(e), true); }
  }

  function confirmModal(title, text, okLabel) {
    return new Promise((resolve) => {
      const root = $("#modalRoot");
      root.innerHTML = `<div class="modal-scrim"><div class="modal" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="foot"><button class="btn" data-m="no" type="button">Cancel</button><button class="btn primary" data-m="yes" type="button">${esc(okLabel || "OK")}</button></div></div></div>`;
      const done = (v) => { root.innerHTML = ""; document.removeEventListener("keydown", onKey, true); resolve(v); };
      const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); done(false); } if (e.key === "Enter") { e.stopPropagation(); done(true); } };
      document.addEventListener("keydown", onKey, true);
      root.querySelector('[data-m="yes"]').focus();
      root.onclick = (e) => { const b = e.target.closest("[data-m]"); if (b) done(b.dataset.m === "yes"); else if (e.target.classList.contains("modal-scrim")) done(false); };
    });
  }

  async function loadLogs() {
    try {
      const res = await api("events", { level: P.get("level", ""), kind: P.get("lkind", "all"), q: P.get("lq", ""), limit: 400 }, { key: "logs" });
      state.logs = res.events;
    } catch (e) { state.logs = null; $("#tab-logs").innerHTML = `<div class="placeholder">${esc(errText(e))}</div>`; return; }
    renderLogs();
  }

    root.innerHTML = `
      <div class="logs-bar">
        <div class="seg">${[["", "All"], ["info", "Info"], ["warn", "Warnings"], ["error", "Errors"]].map(([v, t]) => `<button type="button" data-level="${v}" aria-pressed="${lvl === v}">${t}</button>`).join("")}</div>
        <select class="select" id="lKind">${kinds.map((k) => `<option value="${k}"${k === kind ? " selected" : ""}>${k === "all" ? "All events" : k[0].toUpperCase() + k.slice(1)}</option>`).join("")}</select>

        </tbody></table>` : `<div class="placeholder">No events match.</div>`}

  }

  async function loadSettings() {
    try { state.settings = await api("settings", {}, { key: "settings" }); }
    catch (e) { if (P.get("tab", "gallery") === "settings") $("#tab-settings").innerHTML = `<div class="placeholder">${esc(errText(e))}</div>`; return; }
    if (state.settings.daemon !== undefined) state.dstat = state.settings.daemon;
    renderStatus();
    if (P.get("tab", "gallery") === "settings") renderSettings();
    if (P.get("tab", "gallery") === "gallery" && state.list) renderGallery();
  }

  }

  function planAt(rows, t) {
    if (!rows || !rows.length) return [1, 0.5, 0.5];

      return `<div class="ctl"><div class="t">Zoom on clicks</div><p class="zoomnote">${note}</p>${find}
        <div class="row"><div class="lbl">Auto zoom<small>Zoom in where you click.</small></div><label class="switch"><input type="checkbox" data-zoom="auto"${z.auto ? " checked" : ""}><span></span></label></div>
        <div class="ctl"><label for="st-zoom">Zoom<output id="st-zoom-o">${z.amount.toFixed(1)}×</output></label><input type="range" id="st-zoom" data-zoomamount min="${info.range[0]}" max="${info.range[1]}" step="0.1" value="${z.amount}"></div>
        <div class="row"><div class="lbl">Follow the cursor<small>Move the view when the cursor leaves it.</small></div><label class="switch"><input type="checkbox" data-zoom="follow"${z.follow ? " checked" : ""}><span></span></label></div>
        <div class="row"><div class="lbl">Click rings<small>Show a ring at each click.</small></div><label class="switch"><input type="checkbox" data-zoom="rings"${z.rings ? " checked" : ""}><span></span></label></div></div>`;
    },
    renderZoom() { const el = $("#reelZoom"); if (el && this.video) el.innerHTML = this.zoomHtml(); },
    renderSide() {
      const L = this.lib; const o = this.opts;
      const groups = [["japanese", "Japanese"], ["gradient", "Gradients"], ["solid", "Plain"]];
      const body = $("#studioRoot .body");
      body.innerHTML = `${this.video ? `<div id="reelZoom">${this.zoomHtml()}</div>` : ""}
        ${groups.map(([g, t]) => `<div class="ctl"><div class="t">${t}</div><div class="swatches">${L.backgrounds.filter((b) => b.group === g).map((b) => `<button type="button" data-bg="${esc(b.id)}" aria-pressed="${o.bg === b.id}" title="${esc(b.name)}"><canvas width="96" height="64" data-sw="${esc(b.id)}"></canvas><span class="nm">${esc(b.name)}</span></button>`).join("")}</div></div>`).join("")}
        <div class="ctl"><div class="t">Frame</div><div class="chips">${L.frames.map((f) => `<button type="button" data-frame="${esc(f.id)}" aria-pressed="${o.frame === f.id}">${esc(f.name)}</button>`).join("")}</div></div>
        ${[["padding", "Space around", 0, 25, 1, "%"], ["radius", "Corners", 0, 40, 1, ""], ["shadow", "Shadow", 0, 100, 1, ""], ["inset", "Inner border", 0, 40, 1, ""]].map(([k, t, mn, mx, st, u]) => `<div class="ctl"><label for="st-${k}">${t}<output id="st-${k}-o">${o[k]}${u}</output></label><input type="range" id="st-${k}" data-range="${k}" data-unit="${u}" min="${mn}" max="${mx}" step="${st}" value="${o[k]}"></div>`).join("")}
        <div class="ctl"><div class="t">Shape</div><div class="chips">${L.aspects.map((a) => `<button type="button" data-aspect="${esc(a.id)}" aria-pressed="${o.aspect === a.id}">${esc(a.name)}</button>`).join("")}</div></div>
        <div class="ctl"><label for="st-title">Window title</label><input class="field" id="st-title" data-text="title" value="${esc(o.title)}"></div>
        <div class="ctl"><label for="st-caption">Caption</label><input class="field" id="st-caption" data-text="caption" placeholder="A short line under the ${this.video ? "video" : "image"}" value="${esc(o.caption)}"></div>
        <div class="row" style="margin-top:10px"><div class="lbl">Stamp and postmark<small>Adds a stamp with the capture date.</small></div><label class="switch"><input type="checkbox" data-stamp${o.stamp ? " checked" : ""}><span></span></label></div>`;
      $$("canvas[data-sw]", body).forEach((cv) => { try { L.swatch(cv, cv.dataset.sw); } catch (e) { } });
      this.renderFooter();
    },
    renderFooter() {
      const job = this.jobs.style, saving = this.busy === "style" || !!job;
      const label = job ? `Saving… ${Math.round((job.progress || 0) * 100)}%` : saving ? "Preparing…" : "Save";
      const foot = $("#studioRoot footer"); if (!foot) return;
      foot.innerHTML = `<button class="btn" data-st="default" type="button" title="Use this style each time the editor opens">Make default</button><button class="btn" data-st="save" type="button"${saving ? " disabled" : ""}>${label}</button><button class="btn primary" data-st="copy" type="button"${saving ? " disabled" : ""}>${ICONS.copy}Copy</button>`;
    },
    set(k, v) { this.opts[k] = v; this.draw(); },
    setZoom(k, v) {
      this.zoom[k] = v;
      if (k === "rings") { this.frame(); return; }
      if (k === "auto") { this.renderTimeline(); this.frame(); return; }
      this.later("plan", 150, () => this.loadPlan().catch((e) => snack(errText(e), true)));
    },
    toggleClick(i) {
      const skip = new Set(this.zoom.skip);
      if (skip.has(i)) skip.delete(i); else skip.add(i);
      this.zoom.skip = Array.from(skip).sort((a, b) => a - b);
      this.renderTimeline();
      this.loadPlan().catch((e) => snack(errText(e), true));
    },
    async follow(kind) {
      const id = this.id;
      const render = () => (kind === "style" ? this.renderFooter() : this.renderZoom());
      let st = { state: "running", progress: 0 };
      while (st.state === "running") {
        if (!this.alive(id)) return st;
        this.jobs[kind] = st;
        render();
        await new Promise((r) => setTimeout(r, 800));
        try { st = await api("video_job", { id, kind }, { key: "reeljob-" + kind }); } catch (e) { st = { state: "error", error: errText(e) }; }
      }
      if (!this.alive(id)) return st;
      this.jobs[kind] = null;
      render();
      if (st.state === "error") snack(st.error || "The job stopped.", true);
      else if (kind === "style") { snack("The styled video is in the gallery.", false, true); loadList(true); }
      else {
        this.vinfo = await api("video_info", { id });
        if (!this.alive(id)) return st;
        this.zoom.skip = [];
        this.renderZoom();
        await this.loadPlan();
        snack(`Hagaki found ${st.clicks || 0} likely click${st.clicks === 1 ? "" : "s"}.`, false, true);
      }
      return st;
    },
    async detect() {
      if (this.jobs.detect) return;
      try {
        const id = this.id;
        await api("detect_clicks", { id });
        if (this.alive(id)) await this.follow("detect");
      } catch (e) { snack(errText(e), true); this.jobs.detect = null; this.renderZoom(); }
    },
    async exportVideo(copy) {
      if (this.busy || this.jobs.style) return;
      const id = this.id;
      this.busy = "style"; this.renderFooter();
      try {
        await api("style_video", { id, request: { opts: this.opts, zoom: this.zoom, copy } });
        this.busy = "";
        if (this.alive(id)) await this.follow("style");
      } catch (e) { snack(errText(e), true); }
      finally { this.busy = ""; if (this.alive(id)) this.renderFooter(); }
    },
    async export(copy) {
      if (this.video) return this.exportVideo(copy);
      const btns = $$("#studioRoot footer .btn"); btns.forEach((b) => (b.disabled = true));
      try {
        const blob = await this.lib.toBlob(this.img, Object.assign({}, this.opts, { scale: 1 }), this.meta());
        const data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
        const style = Object.assign({}, this.opts); delete style.title;
        const r = await api("save_styled", { id: this.item.id, data, style, copy: copy ? "true" : "false" });
        snack(copy ? "Saved and copied to the clipboard." : "Saved as a new styled image.", false, true);
        loadList(true);
        return r.item;
      } catch (e) { snack(errText(e), true); }
      finally { btns.forEach((b) => (b.disabled = false)); }
    },
  };

  function bind() {
    document.addEventListener("click", async (e) => {
      const t = e.target;
      const tab = t.closest("nav.tabs button"); if (tab) { P.set("tab", tab.dataset.tab); return; }
      if (t.closest("#statusChip")) {
        if (state.dstat && state.dstat.recording) { try { await daemonCall("/stop"); } catch (er) { snack(errText(er), true); } return; }
        if (state.daemon.running) turnOff(); else turnOn();
        return;
      }
      const cap = t.closest("[data-capture]"); if (cap) { capture(cap.dataset.capture); return; }
      const card = t.closest(".it[data-id]"); if (card) { openItem(card.dataset.id); return; }
      const vw = t.closest("[data-view]"); if (vw) { setPref("view", vw.dataset.view); return; }
      const so = t.closest("[data-sort]"); if (so) { const c = so.dataset.sort; const s = curSort(); setPref("sort", c + ":" + (s.col === c ? (s.dir === "asc" ? "desc" : "asc") : (["name", "kind", "app", "title"].includes(c) ? "asc" : "desc"))); return; }
      const open = t.closest("[data-open]"); if (open) { P.set("studio", ""); openItem(open.dataset.open); return; }
      const kind = t.closest("[data-kind]"); if (kind) { state.limit = 120; P.set("kind", kind.dataset.kind === "all" ? "" : kind.dataset.kind); return; }
      const ap = t.closest("[data-app]"); if (ap) { state.limit = 120; P.set("app", ap.dataset.app); return; }
      const dy = t.closest("[data-days]"); if (dy) { state.limit = 120; P.set("days", dy.dataset.days === "0" ? "" : dy.dataset.days); return; }
      const lvl = t.closest("[data-level]"); if (lvl) { P.set("level", lvl.dataset.level); return; }
      const st = t.closest("[data-st]");
      if (st) {
        const a = st.dataset.st;
        if (a === "close") P.set("studio", "");
        if (a === "save") Studio.export(false);
        if (a === "copy") Studio.export(true);
        if (a === "default") {
          const style = Object.assign({}, Studio.opts); delete style.title; delete style.date;
          if (Studio.video) style.zoom = { auto: Studio.zoom.auto, amount: Studio.zoom.amount, follow: Studio.zoom.follow };
          await saveSettings({ style }, false);
        }
        return;
      }
      const reel = t.closest("[data-reel]");
      if (reel && Studio.video) { if (reel.dataset.reel === "play") Studio.togglePlay(); else if (reel.dataset.reel === "detect") Studio.detect(); return; }
      const ck = t.closest("[data-click]"); if (ck && Studio.video) { Studio.toggleClick(Number(ck.dataset.click)); return; }
      const tl = t.closest("#reelTl"); if (tl && Studio.video) { const r = tl.getBoundingClientRect(); Studio.seek((e.clientX - r.left) / r.width); return; }
      const bg = t.closest("[data-bg]"); if (bg && Studio.open) { $$("[data-bg]").forEach((b) => b.setAttribute("aria-pressed", String(b === bg))); Studio.set("bg", bg.dataset.bg); return; }
      const fr = t.closest("[data-frame]"); if (fr && Studio.open) { $$("[data-frame]").forEach((b) => b.setAttribute("aria-pressed", String(b === fr))); Studio.set("frame", fr.dataset.frame); return; }
      const asp = t.closest("[data-aspect]"); if (asp && Studio.open) { $$("[data-aspect]").forEach((b) => b.setAttribute("aria-pressed", String(b === asp))); Studio.set("aspect", asp.dataset.aspect); return; }
      const rec = t.closest("[data-rec]"); if (rec) { startRecorder(rec.dataset.rec, rec); return; }
      const clr = t.closest("[data-clear]"); if (clr) { await saveSettings({ hotkeys: { [clr.dataset.clear]: "" } }, true); return; }
      const tok = t.closest("[data-token]"); if (tok) { const el = $("#namePattern"); el.value = (el.value + " " + tok.dataset.token).trim(); el.focus(); previewName(); return; }
      const fmt = t.closest("[data-format]"); if (fmt) { saveSettings({ image_format: fmt.dataset.format }, false); return; }
      const rs = t.closest("[data-res]"); if (rs) { saveSettings({ [rs.dataset.res === "rec" ? "record" : "capture"]: { scale: Number(rs.dataset.scale) } }, false); return; }
      const dl = t.closest("[data-delay]"); if (dl) { saveSettings({ capture: { delay: Number(dl.dataset.delay) } }, false); return; }
      const au = t.closest("[data-audio]"); if (au) { saveSettings({ record: { audio: au.dataset.audio } }, false); return; }
      const mm = t.closest("[data-maxmin]"); if (mm) { saveSettings({ record: { max_seconds: Number(mm.dataset.maxmin) * 60 } }, false); return; }
      const sm = t.closest("[data-sharemode]"); if (sm) { saveSettings({ share: { mode: sm.dataset.sharemode } }, false); return; }
      const a = t.closest("[data-act]");
      if (!a) return;
      const act = a.dataset.act;
      if (act === "close-drawer") { closeDrawer(); return; }
      if (act === "prev") { stepItem(-1); return; }
      if (act === "next") { stepItem(1); return; }
      if (act === "more") { state.limit += 120; loadList(true); return; }
      if (act === "toggle-nav") { setPref("nav", curNav() === "on" ? "off" : "on"); return; }
      if (act === "clear-filters") { P.set("q", ""); P.set("kind", ""); P.set("app", ""); P.set("days", ""); $("#q").value = ""; return; }
      if (act === "verify-all") { a.disabled = true; try { await api("verify_all"); snack("Hagaki checks all files now. The result shows in this log."); } catch (er) { snack(errText(er), true); } a.disabled = false; return; }
      if (act === "rescan") { a.disabled = true; try { await api("rescan"); snack("Hagaki scans the library folder now. New files show in the gallery."); } catch (er) { snack(errText(er), true); } a.disabled = false; return; }
      if (act === "open-log") { api("open_log"); return; }
      if (["copy", "reveal", "open-file", "verify", "copy-ocr", "copy-link", "ocr", "magic", "share", "trash", "style"].includes(act)) { itemAction(act); return; }
      if (a.tagName === "INPUT" && a.type === "checkbox") return;
      settingsAction(a);
    });
    document.addEventListener("change", (e) => {
      const t = e.target;
      if (t.id === "fGroup") { setPref("group", t.value); return; }
      if (t.id === "lKind") { P.set("lkind", t.value === "all" ? "" : t.value); return; }
      if (t.matches("[data-set]")) { saveSettings(setPath({}, t.dataset.set, t.checked), false); return; }
      if (t.matches("[data-act]") && t.type === "checkbox") { settingsAction(t); return; }
      if (t.matches("[data-stamp]") && Studio.open) { Studio.set("stamp", t.checked); return; }
      if (t.matches("[data-zoom]") && Studio.video) { Studio.setZoom(t.dataset.zoom, t.checked); return; }
      if (t.id === "libPath") { saveSettings({ library_dir: t.value }, false); return; }
      if (t.id === "tagsInput" || t.id === "noteInput") { saveMeta(); return; }
    });
    document.addEventListener("input", (e) => {
      const t = e.target;
      if (t.matches("[data-range]") && Studio.open) { const k = t.dataset.range; const v = Number(t.value); const o = $(`#st-${k}-o`); if (o) o.textContent = v + (t.dataset.unit || ""); Studio.set(k, v); return; }
      if (t.matches("[data-text]") && Studio.open) { Studio.set(t.dataset.text, t.value); return; }
      if (t.matches("[data-zoomamount]") && Studio.video) { const v = Number(t.value); $("#st-zoom-o").textContent = v.toFixed(1) + "×"; Studio.setZoom("amount", v); return; }
      if (t.id === "namePattern") { previewName(); return; }
    });
    let qTimer = null;
    $("#q").addEventListener("input", (e) => {
      clearTimeout(qTimer);
      const v = e.target.value;
      qTimer = setTimeout(() => { state.limit = 120; P.set("q", v.trim()); if (P.get("tab", "gallery") !== "gallery") P.set("tab", "gallery"); }, 220);
    });
    document.addEventListener("keydown", (e) => {
      if (recorder) return;
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
      if (e.key === "Enter" && document.activeElement && document.activeElement.id === "nameInput") { e.preventDefault(); document.activeElement.blur(); return; }
      if (e.key === "Escape") {
        if ($("#modalRoot").innerHTML) return;
        if (Studio.open) { P.set("studio", ""); return; }
        if (state.item) { closeDrawer(); return; }
        if (typing) { document.activeElement.blur(); return; }
      }
      if (e.key === " " && Studio.video && !(typing && !["checkbox", "range"].includes(document.activeElement.type))) { e.preventDefault(); Studio.togglePlay(); return; }
      if (typing) return;
      if (e.key === "Enter" && document.activeElement && document.activeElement.matches("tr.it[data-id]")) { openItem(document.activeElement.dataset.id); return; }
      if (e.key === "/") { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
      if (e.key === "v" && (e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && !Studio.open && !$("#modalRoot").innerHTML) { e.preventDefault(); pasteClipboard(); return; }
      if (state.item && !Studio.open) {
        if (e.key === "ArrowLeft") { stepItem(-1); return; }
        if (e.key === "ArrowRight") { stepItem(1); return; }
        if (e.key === "c" && !e.metaKey && !e.ctrlKey) { itemAction("copy"); return; }
        if (e.key === "s" && !e.metaKey && !e.ctrlKey) { itemAction("style"); return; }
      }
    });
    document.addEventListener("focusout", (e) => {
      if (e.target && e.target.id === "nameInput") saveName();
      if (e.target && e.target.id === "lq") P.set("lq", e.target.value.trim());
    });
    document.addEventListener("keyup", (e) => { if (e.target && e.target.id === "lq" && e.key === "Enter") P.set("lq", e.target.value.trim()); });
  }

  function boot() {
    state.preview = isPreview();
    if (state.preview) { renderPreviewPlaceholder(); return; }
    bind();
    fused.params.onChange(render);
    try { fused.daemon.watch((s) => { state.daemon = s; renderStatus(); if (P.get("tab", "gallery") === "settings") renderSettings(); if (P.get("tab", "gallery") === "gallery" && state.list) renderGallery(); }); } catch (e) { }
    refreshDaemon();
    loadSettings();
    render();
    setInterval(poll, 1500);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
  }

  boot();
})();
</script>
</body>
</html>
